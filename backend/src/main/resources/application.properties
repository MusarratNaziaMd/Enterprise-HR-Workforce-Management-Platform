# ============================================================================
# HRpilot Enterprise HR Platform — Application Configuration
# ============================================================================

# ── Server ──
server.port=8080
server.servlet.context-path=/api/v1
server.error.include-message=always
server.error.include-binding-errors=always

# ── Spring Application ──
spring.application.name=hrpilot

# ── Jackson Serialization ──
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
spring.jackson.time-zone=UTC

# ── PostgreSQL Datasource (Supabase) ──

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.open-in-view=false

# ── JWT Configuration ──
# SECRET: Base64-encoded 256-bit key (NEVER commit real secrets to VCS)
# Generate with: openssl rand -base64 32
app.jwt.secret=dGVzdC1wZW9wbGVmbG93LXNlY3JldC1rZXktMjU2LWJpdHMtZm9yLWpz
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000
app.jwt.issuer=hrpilot-enterprise

# ── Logging ──
logging.level.root=INFO
logging.level.com.enterprise.peopleflow=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ── Actuator ──
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ── SpringDoc OpenAPI ──
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

